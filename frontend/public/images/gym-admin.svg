<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <!--
    Admin login panel: a trainer standing on the floor, checking the day on a tablet — the one
    glowing thing in the room, because on this page the job is running the gym, not lifting in
    it. Plate tree and wall-mounted bars behind; a window on the left throws the ambient light.

    Same rules as the other scenes: dark on purpose (a white caption and a scrim sit over the
    lower third), essential content within x 60..840 to survive the panel's side-crop, and a
    faceless silhouette rather than a person with an identity.
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2338"/>
      <stop offset="1" stop-color="#14161f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191c29"/>
      <stop offset="1" stop-color="#0b0c12"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b7bf0" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#4a3f8f" stop-opacity=".26"/>
      <stop offset="1" stop-color="#221d3d" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="tabglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7fa8ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7fa8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx=".5" cy=".42" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </radialGradient>
  </defs>

  <!-- room -->
  <rect width="900" height="450" fill="url(#wall)"/>
  <rect y="442" width="900" height="10" fill="#0d0f17"/>
  <rect y="450" width="900" height="250" fill="url(#floor)"/>

  <!-- window, left -->
  <g>
    <rect x="62" y="72" width="276" height="286" rx="10" fill="#0b0d15"/>
    <rect x="70" y="80" width="260" height="270" rx="6" fill="url(#glass)"/>
    <circle cx="146" cy="150" r="17" fill="#ffffff" opacity=".09"/>
    <circle cx="258" cy="188" r="11" fill="#ffffff" opacity=".06"/>
    <rect x="194" y="80" width="10" height="270" fill="#0b0d15"/>
    <rect x="70" y="210" width="260" height="10" fill="#0b0d15"/>
  </g>
  <polygon points="70,80 330,80 250,700 -20,700" fill="#ffffff" opacity=".04"/>

  <!-- wall-mounted barbell rack, right of the trainer -->
  <g>
    <rect x="470" y="208" width="222" height="8" rx="4" fill="#262b3f"/>
    <rect x="470" y="262" width="222" height="8" rx="4" fill="#20253a"/>
    <rect x="474" y="200" width="10" height="76" fill="#181c2c"/>
    <rect x="678" y="200" width="10" height="76" fill="#181c2c"/>
    <rect x="455" y="200" width="252" height="6" rx="3" fill="#3d4460"/>
    <circle cx="466" cy="203" r="12" fill="#2b3149"/>
    <circle cx="696" cy="203" r="12" fill="#2b3149"/>
  </g>

  <!-- plate tree, far right -->
  <g>
    <rect x="700" y="642" width="90" height="10" rx="4" fill="#12151f"/>
    <rect x="736" y="468" width="14" height="180" fill="#1c2030"/>
    <circle cx="743" cy="508" r="30" fill="#d3484f"/>
    <circle cx="743" cy="508" r="30" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".12"/>
    <circle cx="743" cy="508" r="8" fill="#0d0f16"/>
    <circle cx="743" cy="566" r="26" fill="#3e6fd9"/>
    <circle cx="743" cy="566" r="26" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".12"/>
    <circle cx="743" cy="566" r="7" fill="#0d0f16"/>
    <circle cx="743" cy="616" r="22" fill="#e09b3d"/>
    <circle cx="743" cy="616" r="22" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".12"/>
    <circle cx="743" cy="616" r="6" fill="#0d0f16"/>
  </g>

  <!-- dumbbell pair resting on the floor mid-right -->
  <g fill="#171b29">
    <ellipse cx="586" cy="642" rx="46" ry="7" fill="#000000" opacity=".3"/>
    <rect x="562" y="622" width="34" height="8" rx="4" fill="#343a54"/>
    <rect x="551" y="612" width="15" height="28" rx="5"/><rect x="590" y="612" width="15" height="28" rx="5"/>
    <rect x="606" y="630" width="30" height="7" rx="3.5" fill="#343a54"/>
    <rect x="596" y="621" width="13" height="25" rx="4"/><rect x="631" y="621" width="13" height="25" rx="4"/>
  </g>

  <!-- the trainer -->
  <g>
    <ellipse cx="388" cy="648" rx="95" ry="13" fill="#000000" opacity=".38"/>
    <!-- glow from the tablet, painted onto the body before the tablet itself -->
    <ellipse cx="396" cy="372" rx="120" ry="86" fill="url(#tabglow)"/>
    <g fill="#0a0c14">
      <circle cx="385" cy="245" r="23"/>
      <rect x="375" y="262" width="20" height="18"/>
      <path d="M347 285Q385 266 423 285L416 430Q385 442 354 430Z"/>
      <rect x="352" y="424" width="64" height="42" rx="14"/>
      <rect x="356" y="460" width="24" height="150" rx="12"/>
      <g transform="rotate(3 402 460)"><rect x="390" y="460" width="24" height="148" rx="12"/></g>
      <rect x="348" y="602" width="36" height="11" rx="5"/>
      <rect x="396" y="600" width="36" height="11" rx="5" transform="rotate(3 396 600)"/>
      <!-- hanging arm -->
      <g transform="rotate(-7 423 296)"><rect x="414" y="290" width="17" height="62" rx="8"/></g>
      <g transform="rotate(-19 428 350)"><rect x="420" y="348" width="16" height="58" rx="8"/></g>
      <!-- arm holding the tablet -->
      <g transform="rotate(15 350 296)"><rect x="341" y="292" width="17" height="56" rx="8"/></g>
      <g transform="rotate(62 338 346)"><rect x="330" y="342" width="16" height="56" rx="8"/></g>
    </g>
    <!-- rim light from the window, so the dark figure separates from the dark wall -->
    <path d="M364 234a23 23 0 0 1 40 -3" fill="none" stroke="#cfd6ff" stroke-width="3" opacity=".14"/>
    <path d="M350 286Q385 268 420 286" fill="none" stroke="#cfd6ff" stroke-width="3" opacity=".10"/>
    <!-- lanyard -->
    <path d="M373 290 385 330 397 290" fill="none" stroke="#d9435f" stroke-width="3" opacity=".5"/>
    <rect x="380" y="328" width="12" height="16" rx="2" fill="#d9435f" opacity=".55"/>
    <!-- the tablet -->
    <g transform="rotate(-10 396 378)">
      <rect x="358" y="352" width="76" height="52" rx="7" fill="#05070c" stroke="#2a3148" stroke-width="2"/>
      <rect x="364" y="358" width="64" height="40" rx="4" fill="#9fc0ff" opacity=".92"/>
      <rect x="370" y="364" width="30" height="4" rx="2" fill="#ffffff" opacity=".85"/>
      <rect x="370" y="372" width="44" height="3" rx="1.5" fill="#ffffff" opacity=".6"/>
      <rect x="370" y="384" width="5" height="9" fill="#3b6fd0"/>
      <rect x="378" y="380" width="5" height="13" fill="#3b6fd0"/>
      <rect x="386" y="376" width="5" height="17" fill="#3b6fd0"/>
    </g>
  </g>

  <!-- ambient glow and vignette -->
  <circle cx="420" cy="160" r="360" fill="#8f7ff5" opacity=".06"/>
  <rect width="900" height="700" fill="url(#vign)"/>
</svg>
